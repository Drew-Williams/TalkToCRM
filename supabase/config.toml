# All of our functions verify the caller's JWT themselves (see
# supabase/functions/_shared/auth.ts -> getCallerUser) so we can return a
# consistent JSON error shape instead of the platform's default 401 page,
# and so the two OAuth exchange functions can also accept requests where the
# caller intentionally omits a token during local testing.
[functions.crm-proxy]
verify_jwt = false

[functions.hubspot-oauth-exchange]
verify_jwt = false

[functions.pipedrive-oauth-exchange]
verify_jwt = false

[functions.elevenlabs-conversation-token]
verify_jwt = false

# stripe-create-checkout-session checks the caller's JWT itself (via
# getCallerUser, same as crm-proxy etc.) rather than relying on the
# platform's verify_jwt gate, for the same consistent-JSON-error-shape
# reason as the other functions above — it does still require a real caller,
# just an anonymous session is a valid one. stripe-webhook has no Supabase
# JWT to check at all: Stripe's own webhook calls authenticate via a
# signature (verifyStripeSignature), not a bearer token.
[functions.stripe-create-checkout-session]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

# Same reasoning as stripe-webhook — ElevenLabs' own post-call webhook calls
# authenticate via verifyElevenLabsSignature, not a Supabase bearer token.
[functions.elevenlabs-post-call-webhook]
verify_jwt = false

[functions.company-profile]
verify_jwt = false

# ops-dashboard has no Supabase caller at all -- a human navigates here
# directly in a browser -- so there's no bearer token to check at the
# platform level. It checks its own shared-secret query param instead (see
# the function's own comment).
[functions.ops-dashboard]
verify_jwt = false
