project_id = "ziccpxpvrgbsjybjhzhv"

# All of our functions verify the caller's JWT themselves (see
# supabase/functions/_shared/auth.ts -> getCallerUser) so we can return a
# consistent JSON error shape instead of the platform's default 401 page,
# and so the two OAuth exchange functions can also accept requests where the
# caller intentionally omits a token during local testing.
[functions.crm-proxy]
verify_jwt = false

[functions.hubspot-oauth-exchange]
verify_jwt = false

[functions.pipedrive-oauth-exchange]
verify_jwt = false

[functions.elevenlabs-conversation-token]
verify_jwt = false

# Neither Stripe function has a Supabase JWT to check at all: the checkout
# session is created before the visitor has an account, and Stripe's own
# webhook calls authenticate via a signature (verifyStripeSignature), not a
# bearer token.
[functions.stripe-create-checkout-session]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false
